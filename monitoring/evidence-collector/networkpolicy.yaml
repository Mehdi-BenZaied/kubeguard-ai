apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeguard-evidence-collector-isolation
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: kubeguard-evidence-collector
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: kubeguard-incident-receiver
      ports:
        - port: 8081
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
