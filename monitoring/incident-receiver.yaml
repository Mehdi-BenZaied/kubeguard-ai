apiVersion: v1
kind: ConfigMap
metadata:
  name: kubeguard-incident-receiver
  namespace: monitoring
data:
  receiver.py: |
    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/health":
                self.send_error(404)
                return
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_POST(self):
            if self.path != "/alerts":
                self.send_error(404)
                return

            size = int(self.headers.get("Content-Length", "0"))
            if size <= 0 or size > 1000000:
                self.send_error(413)
                return

            try:
                payload = json.loads(self.rfile.read(size))
            except (ValueError, UnicodeDecodeError):
                self.send_error(400)
                return

            event = {
                "received_at": datetime.now(timezone.utc).isoformat(),
                "payload": payload,
            }

            print(json.dumps(event), flush=True)

            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"received")

    ThreadingHTTPServer(("0.0.0.0", 8081), Handler).serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard-incident-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeguard-incident-receiver
  template:
    metadata:
      labels:
        app: kubeguard-incident-receiver
    spec:
      automountServiceAccountToken: false
      containers:
        - name: receiver
          image: docker.io/library/kubeguard-api:0.2
          imagePullPolicy: Never
          command: ["python", "-u", "/opt/receiver.py"]
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: receiver-code
              mountPath: /opt
              readOnly: true
      volumes:
        - name: receiver-code
          configMap:
            name: kubeguard-incident-receiver

---
apiVersion: v1
kind: Service
metadata:
  name: kubeguard-incident-receiver
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: kubeguard-incident-receiver
  ports:
    - port: 8081
      targetPort: 8081