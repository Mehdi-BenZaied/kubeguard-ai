apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard-incident-agent
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubeguard-incident-agent
  template:
    metadata:
      labels:
        app: kubeguard-incident-agent
    spec:
      serviceAccountName: kubeguard-incident-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-storage
          image: docker.io/library/kubeguard-api:0.2
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - mkdir -p /data/agent && chown 10001:10001 /data/agent && chmod 0700 /data/agent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: agent-state
              mountPath: /data
      containers:
        - name: agent
          image: docker.io/library/kubeguard-api:0.2
          imagePullPolicy: Never
          command: ["python", "-u", "/opt/agent/auto_incident_agent_k8s.py"]
          # PREVIEW ONLY by default: no incident POSTs. Send mode is a separate opt-in.
          args: ["--samples", "0", "--interval-sec", "30"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: agent-code
              mountPath: /opt/agent
              readOnly: true
            - name: agent-state
              mountPath: /data
      volumes:
        - name: agent-code
          configMap:
            name: kubeguard-incident-agent-code
            defaultMode: 0444
        - name: agent-state
          persistentVolumeClaim:
            claimName: kubeguard-incident-agent-state
