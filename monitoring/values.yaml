# KubeGuard AI - lightweight Kubernetes monitoring lab

defaultRules:
  create: false

alertmanager:
  enabled: false

# MicroK8s uses dqlite rather than etcd by default.
kubeEtcd:
  enabled: false

# We'll introduce control-plane metrics separately.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

prometheus:
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: 3GB
    scrapeInterval: 30s

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: microk8s-hostpath
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true

  admin:
    existingSecret: grafana-admin

  sidecar:
    datasources:
      alertmanager:
        enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    type: pvc
    storageClassName: microk8s-hostpath
    accessModes:
      - ReadWriteOnce
    size: 1Gi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi