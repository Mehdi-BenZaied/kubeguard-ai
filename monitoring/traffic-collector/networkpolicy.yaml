# Applies only to the collector pod. Restricts outgoing connections to:
# * DNS in kube-system (UDP/TCP 53)
# * Prometheus TCP 9090 within namespace monitoring
# This relies on a CNI that enforces Kubernetes NetworkPolicy (MicroK8s Calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeguard-traffic-collector-isolation
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: kubeguard-traffic-collector
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
