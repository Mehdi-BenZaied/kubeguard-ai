apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeguard-api
  namespace: kubeguard

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kubeguard-api

  template:
    metadata:
      labels:
        app: kubeguard-api

    spec:
      containers:
        - name: kubeguard-api
          image: docker.io/library/kubeguard-api:0.2
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10